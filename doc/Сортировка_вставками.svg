<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1190" viewBox="0 0 1100 1190">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#25354a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="550.0" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Сортировка вставками по двум ключам</text>
<rect x="360" y="65" width="380" height="55" rx="27.5" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="98.5" text-anchor="middle" font-family="Arial" font-size="16">Начало SortDescending</text>
<rect x="360" y="155" width="380" height="55" rx="0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="188.5" text-anchor="middle" font-family="Arial" font-size="16">i = 1</text>
<polygon points="550.0,250 740,300.0 550.0,350 360,300.0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="306.0" text-anchor="middle" font-family="Arial" font-size="16">i &lt; длина массива?</text>
<rect x="850" y="275" width="200" height="55" rx="27.5" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="950.0" y="308.5" text-anchor="middle" font-family="Arial" font-size="16">Конец</text>
<polyline points="550,120 550,155" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<polyline points="550,210 550,250" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<polyline points="740,300 850,300" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="775" y="285" font-family="Arial" font-size="15">Нет</text>
<rect x="360" y="400" width="380" height="70" rx="0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="430.5" text-anchor="middle" font-family="Arial" font-size="16">current = buses[i]</text>
<text x="550.0" y="451.5" text-anchor="middle" font-family="Arial" font-size="16">j = i − 1</text>
<polyline points="550,350 550,400" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="562" y="380" font-family="Arial" font-size="15">Да</text>
<polygon points="550.0,530 840,620.0 550.0,710 260,620.0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="605.0" text-anchor="middle" font-family="Arial" font-size="16">j ≥ 0 и (buses[j].StopCount &lt; current.StopCount</text>
<text x="550.0" y="626.0" text-anchor="middle" font-family="Arial" font-size="16">или при равных StopCount</text>
<text x="550.0" y="647.0" text-anchor="middle" font-family="Arial" font-size="16">buses[j].RouteNumber &lt; current.RouteNumber)?</text>
<polyline points="550,470 550,530" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="580" width="200" height="80" rx="0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="130.0" y="615.5" text-anchor="middle" font-family="Arial" font-size="16">buses[j + 1] = buses[j]</text>
<text x="130.0" y="636.5" text-anchor="middle" font-family="Arial" font-size="16">j = j − 1</text>
<polyline points="260,620 230,620" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="235" y="600" font-family="Arial" font-size="15">Да</text>
<polyline points="130,580 130,500 550,500 550,530" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<rect x="360" y="770" width="380" height="60" rx="0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="806.0" text-anchor="middle" font-family="Arial" font-size="16">buses[j + 1] = current</text>
<polyline points="550,710 550,770" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="562" y="745" font-family="Arial" font-size="15">Нет</text>
<rect x="360" y="885" width="380" height="55" rx="0" fill="#f2f5f8" stroke="#25354a" stroke-width="2"/>
<text x="550.0" y="918.5" text-anchor="middle" font-family="Arial" font-size="16">i = i + 1</text>
<polyline points="550,830 550,885" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<polyline points="740,912 1080,912 1080,225 550,225 550,250" fill="none" stroke="#25354a" stroke-width="2" marker-end="url(#a)"/>
<text x="100" y="1030" font-family="Arial" font-size="18">Приоритет 1: число остановок по убыванию.</text><text x="100" y="1065" font-family="Arial" font-size="18">Приоритет 2: номер маршрута по убыванию.</text><text x="100" y="1100" font-family="Arial" font-size="18">Равные ключи сохраняют исходный взаимный порядок.</text><text x="100" y="1135" font-family="Arial" font-size="18">Худшее время O(n²), дополнительная память O(1).</text></svg>